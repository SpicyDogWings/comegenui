<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Labs — Playground</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../dist/labs/button-labs.umd.js"></script>
  </head>
  <body>
    <div class="topbar">
      <h1 style="font-size:16px;font-weight:600">Button Labs</h1>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnTheme" title="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="main">
      <div class="card">
        <h2>Default Config</h2>
        <div id="default-buttons"></div>

        <hr style="width:100%;border:none;border-top:1px solid var(--border, #eee);margin:16px 0">

        <h2>Custom Config (primary: #10B981, secondary: #8B5CF6)</h2>
        <div id="custom-buttons" class="theme-custom"></div>
      </div>
    </div>

    <script src="playground.js"></script>
    <script src="examples/button-labs.js"></script>
  </body>
</html>
