<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — ComegenUI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../dist/CuAutocomplete.umd.js?t=1"></script>
    <script src="../dist/CuTable.umd.js?t=1"></script>

    <!--
      ═══════════════════════════════════════════
      PLAYGROUND — ComegenUI

      🎯 La carta (`.card`) DENTRO de <main> es la ZONA EDITABLE.
          Cada ejemplo reemplaza TODO el contenido de la carta.
          No acumular — borrar lo anterior y poner lo nuevo.

      Archivos BASE (NO modificar):
        index.html      → estructura base (solo se toca la carta)
        playground.js   → theme toggle, log, init
        style.css       → estilos

      ✅ EDITABLE:
        example.js      → acá va la lógica JS de cada ejemplo
      ═══════════════════════════════════════════
    -->
  </head>
  <body>
    <div class="topbar">
      <h1 style="font-size:16px;font-weight:600">Playground</h1>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnTheme" title="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="main">
      <div class="card" style="max-width: 800px">
        <h2>Autocomplete (standalone)</h2>

        <cu-autocomplete
          id="miAc"
          placeholder="Buscá un rol..."
          color="primary"
          style="width:100%"
        ></cu-autocomplete>

        <h2 style="margin-top:32px">Tabla con Select + Autocomplete editable</h2>
        <p style="font-size:14px;opacity:.6;margin-bottom:16px">Clic en "Departamento" (autocomplete) o "Rol" (select).</p>

        <cu-table
          id="tabla"
          search-enabled
          search-placeholder="Buscar..."
          pagination
          items-per-page="8"
          style="width:100%"
        ></cu-table>

        <div class="log-box" id="log">// Eventos</div>
      </div>
    </div>

    <script src="playground.js"></script>
    <script src="example.js"></script>
    <script src="examples/table.js"></script>
  </body>
</html>
