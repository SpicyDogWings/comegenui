<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — ComegenUI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../dist/CuAlert.umd.js?t=1"></script>
    <script src="../dist/CuBadge.umd.js?t=1"></script>

    <!--
      ═══════════════════════════════════════════
      PLAYGROUND — ComegenUI

      🎯 La carta (`.card`) DENTRO de <main> es la ZONA EDITABLE.
          Cada ejemplo reemplaza TODO el contenido de la carta.
          No acumular — borrar lo anterior y poner lo nuevo.

      Archivos BASE (NO modificar):
        index.html      → estructura base (solo se toca la carta)
        playground.js   → theme toggle, log, init
        style.css       → estilos

      ✅ EDITABLE:
        example.js      → acá va la lógica JS de cada ejemplo
      ═══════════════════════════════════════════
    -->
  </head>
  <body>
    <div class="topbar">
      <h1 style="font-size:16px;font-weight:600">Playground</h1>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnTheme" title="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="main">
      <div class="card" style="max-width: 500px">
        <h2>Alert + Badge (props explícitas)</h2>

        <cu-alert
          id="miAlert"
          color="primary"
          title="Alerta primaria"
          close
        ></cu-alert>

        <div style="margin-top:12px">
          <cu-alert
            color="success"
            title="Operación exitosa"
          ></cu-alert>
        </div>

        <div style="margin-top:12px">
          <cu-alert
            color="danger"
            title="Error"
          >Algo salió mal</cu-alert>
        </div>

        <div style="margin-top:24px">
          <cu-badge color="primary" variant="soft">Nuevo</cu-badge>
          <cu-badge color="success" variant="soft" style="margin-left:8px">Activo</cu-badge>
          <cu-badge color="danger" variant="solid" style="margin-left:8px">Offline</cu-badge>
        </div>

        <div class="log-box" id="log">// Eventos</div>
      </div>
    </div>

    <script src="playground.js"></script>
    <script src="example.js"></script>
  </body>
</html>
