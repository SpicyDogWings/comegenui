<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Labs — Playground</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../dist/button-labs/button-labs.umd.js"></script>
  </head>
  <body>
    <div class="topbar">
      <h1 style="font-size:16px;font-weight:600">Button Labs</h1>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnTheme" title="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="main">
      <div class="card">
        <h2>Button — variantes × colores</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead>
            <tr>
              <th style="padding:6px 8px;text-align:left;opacity:.6">variant \ color</th>
              <th style="padding:6px 8px;text-align:left;opacity:.6">primary</th>
              <th style="padding:6px 8px;text-align:left;opacity:.6">secondary</th>
              <th style="padding:6px 8px;text-align:left;opacity:.6">neutral</th>
              <th style="padding:6px 8px;text-align:left;opacity:.6">success</th>
              <th style="padding:6px 8px;text-align:left;opacity:.6">warning</th>
              <th style="padding:6px 8px;text-align:left;opacity:.6">danger</th>
            </tr>
          </thead>
          <tbody id="button-grid"></tbody>
        </table>
      </div>
    </div>

    <script src="playground.js"></script>
    <script src="examples/button-labs.js"></script>
  </body>
</html>
