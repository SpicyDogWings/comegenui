<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — ComegenUI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../dist/CuFileInput.umd.js?t=2"></script>

    <!--
      ═══════════════════════════════════════════
      PLAYGROUND — ComegenUI

      🎯 La carta (`.card`) DENTRO de <main> es la ZONA EDITABLE.
          Cada ejemplo reemplaza TODO el contenido de la carta.
          No acumular — borrar lo anterior y poner lo nuevo.

      Archivos BASE (NO modificar):
        index.html      → estructura base (solo se toca la carta)
        playground.js   → theme toggle, log, init
        style.css       → estilos

      ✅ EDITABLE:
        example.js      → acá va la lógica JS de cada ejemplo
      ═══════════════════════════════════════════
    -->
  </head>
  <body>
    <div class="topbar">
      <h1 style="font-size:16px;font-weight:600">Playground</h1>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnTheme" title="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="main">
      <div class="card" style="max-width: 800px">
        <h2>FileInput</h2>

        <h3 style="font-size:14px;font-weight:500;margin:12px 0 6px">Básico (neutral, none)</h3>
        <cu-file-input id="fiBasic" placeholder="Arrastra un archivo o hace clic"></cu-file-input>

        <h3 style="font-size:14px;font-weight:500;margin:12px 0 6px">Múltiple + accept (primary, outlined)</h3>
        <cu-file-input id="fiMultiple" color="primary" variant="outlined" multiple accept="image/*" placeholder="Imágenes (múltiples)"></cu-file-input>

        <h3 style="font-size:14px;font-weight:500;margin:12px 0 6px">Modo carpeta (warning, subtle)</h3>
        <cu-file-input id="fiDirectory" color="warning" variant="subtle" directory max-depth="0" placeholder="Solo archivos directos de la carpeta"></cu-file-input>

        <h3 style="font-size:14px;font-weight:500;margin:12px 0 6px">Deshabilitado</h3>
        <cu-file-input id="fiDisabled" disabled placeholder="Deshabilitado"></cu-file-input>

        <h3 style="font-size:14px;font-weight:500;margin:12px 0 6px">Con variante soft (success)</h3>
        <cu-file-input id="fiSoft" color="success" variant="soft" placeholder="Soft success"></cu-file-input>

        <h3 style="font-size:14px;font-weight:500;margin:12px 0 6px">Max 1MB (danger, ghost)</h3>
        <cu-file-input id="fiMaxSize" color="danger" variant="ghost" accept=".pdf,.doc,.docx" max-size="1048576" placeholder="PDF/DOC — máx 1MB"></cu-file-input>

        <div class="log-box" id="log">// Eventos</div>
      </div>
    </div>

    <script src="playground.js"></script>
    <script src="examples/file-input.js"></script>
  </body>
</html>
