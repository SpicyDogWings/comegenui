<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — ComegenUI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../dist/CuSelect.umd.js?t=1"></script>

    <!--
      ═══════════════════════════════════════════
      PLAYGROUND — ComegenUI

      🎯 La carta (`.card`) DENTRO de <main> es la ZONA EDITABLE.
          Cada ejemplo reemplaza TODO el contenido de la carta.
          No acumular — borrar lo anterior y poner lo nuevo.

      Archivos BASE (NO modificar):
        index.html      → estructura base (solo se toca la carta)
        playground.js   → theme toggle, log, init
        style.css       → estilos

      ✅ EDITABLE:
        example.js      → acá va la lógica JS de cada ejemplo
      ═══════════════════════════════════════════
    -->
  </head>
  <body>
    <div class="topbar">
      <h1 style="font-size:16px;font-weight:600">Playground</h1>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnTheme" title="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="main">
      <div class="card" style="max-width: 800px">
        <h2>Select — probando temas</h2>

        <div data-theme="light">
          <cu-select id="selLight" placeholder="Light"></cu-select>
        </div>
        <div data-theme="dark">
          <cu-select id="selDark" placeholder="Dark" color="primary"></cu-select>
        </div>
        <div data-theme="sigacadv2">
          <cu-select id="selSIGACAD" placeholder="Sigacad v2" variant="soft"></cu-select>
        </div>

        <div class="log-box" id="log">// Eventos</div>
      </div>
    </div>

    <script src="playground.js"></script>
    <script src="examples/select.js"></script>
  </body>
</html>
