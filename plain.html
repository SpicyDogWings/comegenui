<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuTable Demo</title>
    <script src="dist/CuBadge.umd.js"></script>
    <script src="dist/CuButton.umd.js"></script>
    <script src="dist/CuTable.umd.js"></script>
    <style>
      body {
        font-family: system-ui;
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <h1>CuTable Demo</h1>
    <cu-table
      id="myTable"
      color="primary"
      variant="solid"
      empty="Cargando datos..."
      pagination
      items-per-page="5"
      show-page-size
      search-enabled
      search-placeholder="Buscar tareas..."
      search-fields='["title"]'
      table-max-height="400px"
    ></cu-table>

    <script>
      const columns = [
        { key: "id", label: "ID", sortable: true },
        {
          key: "title",
          label: "Título",
          sortable: true,
          editable: true,
          inputType: "input",
          validator: (value) => value.trim().length > 0
        },
        {
          key: "completed",
          label: "Completado",
          sortable: true,
          editable: true,
          inputType: "input",
          validator: (value) => !isNaN(value) && (value === "true" || value === "false")
        },
        {
          key: "userId",
          label: "Usuario ID",
          sortable: true
        },
        {
          key: "status",
          label: "Estado",
          badges: (row) => [
            {
              value: row.completed ? "Completado" : "Pendiente",
              color: row.completed ? "success" : "warning",
              variant: "soft"
            }
          ]
        },
        {
          key: "actions",
          label: "Acciones",
          buttons: (row) => [
            {
              label: "Editar",
              onClick: (rowData) => {
                console.log("Edit clicked for row:", rowData);
                alert(`Editing row ${rowData.id}`);
              },
              color: "primary",
              variant: "soft"
            },
            {
              label: "Eliminar",
              onClick: (rowData) => {
                console.log("Delete clicked for row:", rowData);
                alert(`Deleting row ${rowData.id}`);
              },
              color: "danger",
              variant: "soft"
            }
          ]
        }
      ];

      async function init() {
        await customElements.whenDefined('cu-table');
        const table = document.getElementById('myTable');

        const response = await fetch('https://jsonplaceholder.typicode.com/todos/');
        const data = await response.json();

        table.columns = columns;
        table.data = data.slice(0, 50);

        // Add event listeners for search changes
        table.addEventListener('update:search', (event) => {
          console.log('Search query changed to:', event.detail);
        });

        // Add event listeners for pagination changes
        table.addEventListener('update:currentPage', (event) => {
          console.log('Current page changed to:', event.detail);
        });

        table.addEventListener('update:itemsPerPage', (event) => {
          console.log('Items per page changed to:', event.detail);
        });

        // Add event listeners for edit events
        table.addEventListener('edit-start', (event) => {
          console.log('Edit started on row:', event.detail);
        });

        table.addEventListener('edit-save', (event) => {
          console.log('Edit saved:', event.detail);
        });

        table.addEventListener('edit-cancel', (event) => {
          console.log('Edit cancelled on row:', event.detail);
        });
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
