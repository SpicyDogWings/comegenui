<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuTextarea Demo</title>
    <script src="dist/CuTextarea.umd.js"></script>
    <style>
      body {
        font-family: system-ui;
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
      }
      
      .demo-section {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #eee;
        border-radius: 8px;
      }
      
      h2 {
        color: #333;
        margin-top: 0;
      }
      
      .controls {
        margin: 15px 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      
      button {
        padding: 8px 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      
      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>CuTextarea Demo</h1>
    
    <div class="demo-section">
      <h2>Basic Textarea</h2>
      <cu-textarea
        id="basicTextarea"
        placeholder="Type something here..."
        rows="4"
      ></cu-textarea>
      
      <div class="controls">
        <button onclick="getBasicValue()">Get Value</button>
        <button onclick="setBasicValue()">Set Value</button>
        <button onclick="resetBasic()">Reset</button>
        <button onclick="focusBasic()">Focus</button>
      </div>
      <p id="basicOutput"></p>
    </div>

    <div class="demo-section">
      <h2>Textarea with Color Variants</h2>
      <cu-textarea
        id="primaryTextarea"
        placeholder="Primary variant"
        color="#007bff"
        variant="outlined"
        rows="3"
      ></cu-textarea>
      
      <cu-textarea
        id="successTextarea"
        placeholder="Success variant"
        color="#28a745"
        variant="soft"
        rows="3"
        style="margin-top: 10px;"
      ></cu-textarea>
      
      <cu-textarea
        id="warningTextarea"
        placeholder="Warning variant"
        color="#ffc107"
        variant="ghost"
        rows="3"
        style="margin-top: 10px;"
      ></cu-textarea>
    </div>

    <div class="demo-section">
      <h2>Disabled and Readonly Textareas</h2>
      <cu-textarea
        id="disabledTextarea"
        placeholder="This textarea is disabled"
        disabled
        rows="3"
      ></cu-textarea>
      
      <cu-textarea
        id="readonlyTextarea"
        placeholder="This textarea is readonly"
        read-only
        value="You can't edit this content"
        rows="3"
        style="margin-top: 10px;"
      ></cu-textarea>
    </div>

    <div class="demo-section">
      <h2>No Resize Textarea</h2>
      <cu-textarea
        id="noResizeTextarea"
        placeholder="This textarea cannot be resized"
        no-resize
        rows="3"
      ></cu-textarea>
    </div>

    <script>
      async function init() {
        await customElements.whenDefined('cu-textarea');
        console.log('CuTextarea component loaded and ready');
      }

      function getBasicValue() {
        const textarea = document.getElementById('basicTextarea');
        const value = textarea.get();
        document.getElementById('basicOutput').textContent = 'Current value: ' + value;
        console.log('Textarea value:', value);
      }

      function setBasicValue() {
        const textarea = document.getElementById('basicTextarea');
        textarea.set('This value was set programmatically!');
        document.getElementById('basicOutput').textContent = 'Value has been set';
      }

      function resetBasic() {
        const textarea = document.getElementById('basicTextarea');
        textarea.reset();
        document.getElementById('basicOutput').textContent = 'Textarea has been reset';
      }

      function focusBasic() {
        const textarea = document.getElementById('basicTextarea');
        textarea.focus();
        document.getElementById('basicOutput').textContent = 'Textarea is now focused';
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
