<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuInput.iife.js"></script>
    <script src="dist/CuButton.iife.js"></script>
  </head>
  <body>
    <div style="padding: 20px; max-width: 500px; margin: 0 auto">
      <h2>Input Example</h2>
      <cu-input
        id="my-input"
        placeholder="Escribe algo..."
        color="neutral"
        variant="soft"
      ></cu-input>
      <cu-button id="click">Reset</cu-button>
      <div id="display" style="padding: 10px; background: #f5f5f5; border-radius: 8px">
        <strong>Valor actual:</strong> <span id="value">-</span>
      </div>
    </div>

    <script>
      const input = document.getElementById("my-input");
      const display = document.getElementById("value");
      const button = document.getElementById("click");
      input.addEventListener("input", (e) => {
        display.textContent = input.get();
      });
      input.addEventListener("cahnge", (e) => {
        display.textContent = input.get();
      });
      button.addEventListener("click", () => {
        input.reset();
        display.textContent = input.get();
      });
    </script>
  </body>
</html>
