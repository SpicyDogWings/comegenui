<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuTable - Limpiar datos</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuTable.umd.js"></script>
    <script src="dist/CuButton.umd.js"></script>
    <style>
      body {
        padding: 0;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        max-width: 800px;
        width: 100%;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .actions {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="actions">
        <cu-button id="load-btn" color="primary" variant="solid">Cargar Datos</cu-button>
        <cu-button id="clear-btn" color="danger" variant="solid">Limpiar Tabla</cu-button>
      </div>
      <cu-table id="data-table"></cu-table>
    </div>

    <script>
      const dataTable = document.getElementById("data-table");
      const loadBtn = document.getElementById("load-btn");
      const clearBtn = document.getElementById("clear-btn");

      const columns = [
        { key: "id", label: "ID" },
        { key: "name", label: "Nombre" },
        { key: "email", label: "Correo" }
      ];

      const initialData = [
        { id: 1, name: "Juan Pérez", email: "juan@example.com" },
        { id: 2, name: "Ana García", email: "ana@example.com" },
        { id: 3, name: "Carlos López", email: "carlos@example.com" },
        { id: 4, name: "María Rodríguez", email: "maria@example.com" }
      ];

      loadBtn.addEventListener("click", () => {
        dataTable.columns = columns;
        dataTable.data = initialData;
      });

      clearBtn.addEventListener("click", () => {
        // Limpiar tabla: setear data con []
        dataTable.data = [];
        console.log("Tabla limpiada");
      });
    </script>
  </body>
</html>
