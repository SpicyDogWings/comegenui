<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla con Búsqueda - Ejemplo</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuInput.iife.js"></script>
    <script src="dist/CuButton.iife.js"></script>
    <script src="dist/CuBadge.iife.js"></script>
    <script src="dist/CuTable.iife.js"></script>
  </head>
  <body>
    <div style="padding: 20px; max-width: 1000px; margin: 0 auto">
      <h1>Tabla de Posts - JSONPlaceholder</h1>
      <cu-table
        id="posts-table"
        search-enabled="true"
        search-placeholder="Buscar posts..."
        empty="No se encontraron posts"
        style="max-height: 400px; margin-top: 20px"
      ></cu-table>
      <div id="loading" style="padding: 10px; text-align: center; display: none">
        Cargando datos...
      </div>
    </div>

    <script>
      const table = document.getElementById("posts-table");
      const loading = document.getElementById("loading");

      const tableColumns = [
        { key: "id", label: "ID" },
        { key: "title", label: "Título" },
        { key: "body", label: "Contenido" },
        {
          key: "userId",
          label: "User ID",
          badges: (row) => [
            {
              value: String(row.userId),
              color: "primary",
              variant: "subtle",
            },
          ],
        },
      ];

      loading.style.display = "block";

      fetch("https://jsonplaceholder.typicode.com/posts")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Error al cargar datos");
          }
          return response.json();
        })
        .then((posts) => {
          if (table) {
            table.data = posts;
            table.columns = tableColumns;
          }
        })
        .catch((error) => {
          console.error("Error:", error);
          if (table) {
            table.data = [];
            table.empty = "Error al cargar los posts";
          }
        })
        .finally(() => {
          loading.style.display = "none";
        });
    </script>
  </body>
</html>
