<!doctype html>
<html lang="es">    
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal Demo</title>
    <script src="dist/CuModal.umd.js"></script>
    <style>
      body {
        font-family: system-ui;
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
      }
      
      .demo-section {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #eee;
        border-radius: 8px;
      }
      
      h2 {
        color: #333;
        margin-top: 0;
      }
      
      .controls {
        margin: 15px 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      
      button {
        padding: 8px 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      
      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>Modal Demo</h1>
    
    <div class="demo-section">
      <h2>Modal with Footer</h2>
      <cu-modal id="myModal" title="My Modal" description="This is a modal with a footer">
        <div>This is the main content of the modal.</div>
        <div slot="footer">
          <button onclick="closeModal()">Cancel</button>
          <button onclick="handleAction()">Action</button>
        </div>
      </cu-modal>
      
      <div class="controls">
        <button onclick="openModal()">Open Modal</button>
      </div>
    </div>

    <script>
      async function init() {
        await customElements.whenDefined('cu-modal');
        console.log('Modal component loaded and ready');
      }

      function openModal() {
        const modal = document.getElementById('myModal');
        modal.open();
      }

      function closeModal() {
        const modal = document.getElementById('myModal');
        modal.close();
      }

      function handleAction() {
        alert('Action button clicked!');
        closeModal();
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
