<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal con Formulario - ComegenUI</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuModal.umd.js"></script>
    <script src="dist/CuButton.umd.js"></script>
    <script src="dist/CuInput.umd.js"></script>
    <style>
      body {
        padding: 20px;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
      }
      .footer {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 1rem;
      }
      /* Estilos del formulario */
      * {
        box-sizing: border-box;
      }
      .form-group {
        width: 100%;
        display: block;
        margin-bottom: 1rem;
        max-width: 100%;
        padding: 0.5rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-size: 14px;
        color: #374151;
      }
      .form-group cu-input {
          display: block;
        width: 100%;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div>
      <cu-button id="open-form" color="primary" variant="solid">
        Abrir Formulario
      </cu-button>

      <cu-modal id="form-modal" title="Formulario de Contacto" size="md" height="lg">
        <div class="form-group">
          <label>Nombre completo:</label>
          <cu-input id="form-name" placeholder="Juan Pérez" name="name"/>
        </div>
        <div slot="footer" class="footer">
          <cu-button id="form-cancel" color="neutral" variant="ghost">Cancelar</cu-button>
          <cu-button id="form-submit" color="success" variant="solid">Enviar</cu-button>
        </div>
      </cu-modal>
    </div>

    <script>
      const formModal = document.getElementById("form-modal");
      const openFormBtn = document.getElementById("open-form");
      const formCancelBtn = document.getElementById("form-cancel");
      const formSubmitBtn = document.getElementById("form-submit");

      openFormBtn.addEventListener("click", () => formModal.open());

      formCancelBtn.addEventListener("click", () => {
        formModal.close();
        console.log("Acción: CANCELAR");
      });

      formSubmitBtn.addEventListener("click", () => {
        const value = document.getElementById("form-name").get();
        formModal.close();
        console.log("Valor del input:", value);
      });
    </script>
  </body>
</html>
