<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Modal</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuModal.umd.js"></script>
    <script src="dist/CuButton.umd.js"></script>
    <style>
      body {
        padding: 20px;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <cu-button id="open-modal-btn" color="primary" variant="solid">
        Abrir Modal
      </cu-button>

      <cu-modal id="example-modal" title="Modal de Ejemplo" description="Este es un modal con contenido dinámico" color="primary" size="md">
        <p style="margin-bottom: 16px;">Contenido del modal: Este modal muestra información adicional.</p>
        
        <cu-button id="close-from-inside" color="neutral" variant="outlined">
          Cerrar desde dentro
        </cu-button>
      </cu-modal>
    </div>

    <script>
      const modal = document.getElementById("example-modal");
      const openBtn = document.getElementById("open-modal-btn");
      const closeFromInside = document.getElementById("close-from-inside");

      openBtn.addEventListener("click", () => {
        modal.modelValue = true;
      });

      closeFromInside.addEventListener("click", () => {
        modal.modelValue = false;
      });
      
      // Sync modelValue from update:modelValue event
      modal.addEventListener("update:modelValue", (e) => {
        modal.modelValue = e.detail[0];
      });

      modal.addEventListener("close", () => {
        console.log("Modal closed");
      });

      modal.addEventListener("opened", () => {
        console.log("Modal opened");
      });
    </script>
  </body>
</html>
