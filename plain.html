<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Modal Persistente</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuModal.umd.js"></script>
    <script src="dist/CuButton.umd.js"></script>
    <style>
      body {
        padding: 20px;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div>
      <cu-button id="open-modal-btn" color="danger" variant="solid">
        Abrir Modal Persistente
      </cu-button>

      <cu-modal 
        id="persistent-modal" 
        title="Modal Persistente" 
        size="md" 
        color="danger"
        persistent="true"
        closable="false"
      >
        <p style="margin-bottom: 16px;">Este modal no se cierra con el backdrop o con ESC.</p>
        <p style="margin-bottom: 16px; color: #666; font-size: 14px;">Usa el botón para cerrarlo.</p>
        
        <cu-button id="close-persistent" color="danger" variant="solid" slot="footer">
          Entendido
        </cu-button>
      </cu-modal>
    </div>

    <script>
      const modal = document.getElementById("persistent-modal");
      const openBtn = document.getElementById("open-modal-btn");
      const closeBtn = document.getElementById("close-persistent");

      openBtn.addEventListener("click", () => {
        modal.modelValue = true;
      });

      closeBtn.addEventListener("click", () => {
        modal.modelValue = false;
      });

      modal.addEventListener("opened", () => {
        console.log("Modal opened");
      });

      modal.addEventListener("closed", () => {
        console.log("Modal closed");
      });
    </script>
  </body>
</html>
