<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <script src="dist/CuTable.iife.js"></script>
    <script src="dist/CuBadge.iife.js"></script>
  </head>
  <body>
    <cu-table id="posts-table" style="max-width: 800px; max-height: 400px; overflow: auto;"></cu-table>
    <script>
      const table = document.getElementById('posts-table');
      table.columns = [
        { key: "id", label: "#ID" },
        { key: "userId", label: "User" },
        { key: "title", label: "Title" },
        { key: "status", label: "Status", badges: true },
        { key: "tags", label: "Tags", badges: { color: "success", variant: "soft" } },
      ];

      fetch("https://jsonplaceholder.typicode.com/posts")
        .then(response => response.json())
        .then(posts => {
          table.data = posts.slice(0, 10).map(post => ({
            ...post,
            status: post.id % 2 === 0 ? "Published" : "Draft",
            tags: ["Post", post.id % 3 === 0 ? "Featured" : null].filter(Boolean)
          }));
        })
        .catch(error => {
          console.error("Error fetching posts:", error);
        });
    </script>
  </body>
</html>
