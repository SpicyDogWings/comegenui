<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuTable - Fruits with Editable Count</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuTable.umd.js"></script>
    <script src="dist/CuInput.umd.js"></script>
  </head>
  <body>
    <cu-table id="myTable"></cu-table>

    <script>
      const table = document.getElementById('myTable');

      table.data = [
        { name: 'Manzana', stock: 100, count: 10 },
        { name: 'Banana', stock: 50, count: 5 },
        { name: 'Naranja', stock: 75, count: 15 }
      ];

      table.columns = [
        { key: 'name', label: 'Name' },
        { key: 'stock', label: 'Stock' },
        { key: 'count', label: 'Count', editable: true }
      ];
    </script>
  </body>
</html>
