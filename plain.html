<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuTable - Métodos de modificación</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuTable.umd.js"></script>
    <script src="dist/CuButton.umd.js"></script>
    <style>
      body {
        padding: 0;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        max-width: 800px;
        width: 100%;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .actions {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .info {
        background: #e3f2fd;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 1rem;
        font-size: 14px;
        text-align: center;
      }
      .info strong {
        color: #1976d2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="info">
        <strong>Ejemplo:</strong> Métodos para modificar datos de la tabla (addRow, removeRow, pushData)
      </div>
      <div class="actions">
        <cu-button id="load-btn" color="primary" variant="solid">Cargar Datos</cu-button>
        <cu-button id="clear-btn" color="danger" variant="solid">Limpiar Tabla</cu-button>
        <cu-button id="add-btn" color="success" variant="solid">Añadir Fila</cu-button>
        <cu-button id="remove-btn" color="warning" variant="solid">Eliminar Última</cu-button>
        <cu-button id="push-btn" color="info" variant="solid">Añadir Múltiples</cu-button>
      </div>
      <cu-table id="data-table"></cu-table>
    </div>

    <script>
      const dataTable = document.getElementById("data-table");
      const loadBtn = document.getElementById("load-btn");
      const clearBtn = document.getElementById("clear-btn");
      const addBtn = document.getElementById("add-btn");
      const removeBtn = document.getElementById("remove-btn");
      const pushBtn = document.getElementById("push-btn");

      const columns = [
        { key: "id", label: "ID" },
        { key: "name", label: "Nombre" },
        { key: "email", label: "Correo" }
      ];

      const initialData = [
        { id: 1, name: "Juan Pérez", email: "juan@example.com" },
        { id: 2, name: "Ana García", email: "ana@example.com" },
        { id: 3, name: "Carlos López", email: "carlos@example.com" },
        { id: 4, name: "María Rodríguez", email: "maria@example.com" }
      ];

      // Cargar datos iniciales
      loadBtn.addEventListener("click", () => {
        dataTable.columns = columns;
        dataTable.data = initialData;
        console.log("Datos cargados:", initialData);
      });

      // Limpiar tabla
      clearBtn.addEventListener("click", () => {
        dataTable.data = [];
        console.log("Tabla limpiada");
      });

      // Añadir una fila nueva (valida estructura automáticamente)
      addBtn.addEventListener("click", () => {
        const newRow = { id: 5, name: "Nuevo Usuario", email: "nuevo@test.com" };
        const success = dataTable.addRow(newRow);
        if (success) {
          console.log("Fila añadida:", newRow);
        } else {
          console.error("Error: La fila no tiene la estructura correcta");
        }
      });

      // Eliminar la última fila
      removeBtn.addEventListener("click", () => {
        const lastIndex = dataTable.getData().length - 1;
        if (lastIndex >= 0) {
          const success = dataTable.removeRow(lastIndex);
          if (success) {
            console.log("Fila eliminada en índice:", lastIndex);
          }
        } else {
          console.log("No hay filas para eliminar");
        }
      });

      // Añadir múltiples filas a la vez
      pushBtn.addEventListener("click", () => {
        const newRows = [
          { id: 6, name: " Pedro Martínez", email: "pedro@example.com" },
          { id: 7, name: "Laura Hernández", email: "laura@example.com" }
        ];
        const success = dataTable.pushData(newRows);
        if (success) {
          console.log("Filas añadidas:", newRows);
        } else {
          console.error("Error: Las filas no tienen la estructura correcta");
        }
      });
    </script>
  </body>
</html>
