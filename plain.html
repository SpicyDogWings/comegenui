<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla con Posts</title>
    <script src="dist/vendor/vue-runtime.iife.js"></script>
    <script src="dist/CuTable.iife.js"></script>
    <script src="dist/CuInput.iife.js"></script>
    <script src="dist/CuPagination.iife.js"></script>
    <script src="dist/CuButton.iife.js"></script>
    <script src="dist/CuBadge.iife.js"></script>
    <style>
      body {
        padding: 20px;
        max-width: 1000px;
        margin: 0 auto;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Posts de JSONPlaceholder</h1>
    <cu-table
      id="posts-table"
      pagination="true"
      items-per-page="10"
      empty="Cargando..."
      style="margin-top: 20px;"
    ></cu-table>

    <script>
      const table = document.getElementById("posts-table");
      const loading = document.createElement("div");
      loading.textContent = "Cargando...";
      loading.style.padding = "10px";
      loading.style.textAlign = "center";
      table.parentNode.insertBefore(loading, table);

      fetch("https://jsonplaceholder.typicode.com/posts")
        .then((response) => response.json())
        .then((posts) => {
          loading.remove();
          table.data = posts;
          table.columns = [
            { key: "id", label: "ID" },
            { key: "title", label: "Título", editable: true },
            { key: "body", label: "Contenido" }
          ];
        })
        .catch((error) => {
          console.error("Error:", error);
          loading.textContent = "Error al cargar posts";
        });
    </script>
  </body>
</html>
