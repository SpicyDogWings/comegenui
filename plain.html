<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <script src="dist/CuTable.iife.js"></script>
    <script src="dist/CuBadge.iife.js"></script>
  </head>
  <body>
    <cu-table id="posts-table" style="max-width: 800px; max-height: 400px; overflow: auto;"></cu-table>
    <script>
      const table = document.getElementById('posts-table');
      table.columns = [
        { key: "id", label: "#ID" },
        { key: "userId", label: "User" },
        { key: "title", label: "Title" },
        {
          key: "owner",
          label: "Owner",
          badges: (row) => [{
            value: row.userId === 1 ? "Propietario" : "Invitado",
            color: row.userId === 1 ? "primary" : "neutral",
            variant: "solid"
          },
          {
            value: row.id === 1 ? "Primera" : "Otras",
            color: row.userId === 1 ? "primary" : "neutral",
            variant: "solid"
          }]
        },
      ];

      fetch("https://jsonplaceholder.typicode.com/posts")
        .then(response => response.json())
        .then(posts => {
          table.data = posts;
        })
        .catch(error => {
          console.error("Error fetching posts:", error);
        });
    </script>
  </body>
</html>
